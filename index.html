<script>
    (function() {
        'use strict';

        // DOM refs
        const emailDisplay = document.getElementById('emailDisplay');
        const generateBtn = document.getElementById('generateBtn');
        const domainSelect = document.getElementById('domainSelect');
        const copyBtn = document.getElementById('copyBtn');
        const statusText = document.getElementById('statusText');
        const toast = document.getElementById('toast');

        let currentEmail = '';

        // ---------- helpers ----------
        function randomString(length = 8) {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        function generateEmail(domain) {
            const prefix = randomString(7) + (Math.random() > 0.5 ? randomString(4) : '');
            return prefix + domain;
        }

        function updateUI(email) {
            currentEmail = email;
            emailDisplay.textContent = email || '—';
            statusText.textContent = email ? `📨 ${email} · aktif` : 'siap pakai · 0 pesan';
            copyBtn.textContent = '📋 Salin';
            copyBtn.classList.remove('copied');
        }

        function showToast(msg) {
            toast.textContent = msg || '✅ Email disalin';
            toast.classList.add('show');
            clearTimeout(toast._hide);
            toast._hide = setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // ---------- generate ----------
        function generateNewEmail() {
            const domain = domainSelect.value;
            const newEmail = generateEmail(domain);
            updateUI(newEmail);
            // catatan: ini client-side, tidak ada server email. hanya generator.
            // untuk demo, kita simulasikan 'check inbox' nanti.
        }

        // ---------- copy ----------
        function copyEmail() {
            if (!currentEmail) {
                showToast('⚠️ Belum ada email');
                return;
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(currentEmail)
                    .then(() => {
                        copyBtn.textContent = '✅ Tersalin';
                        copyBtn.classList.add('copied');
                        showToast('✅ Email disalin');
                    })
                    .catch(() => {
                        fallbackCopy(currentEmail);
                    });
            } else {
                fallbackCopy(currentEmail);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            textarea.style.left = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                copyBtn.textContent = '✅ Tersalin';
                copyBtn.classList.add('copied');
                showToast('✅ Email disalin');
            } catch (e) {
                showToast('⚠️ Gagal menyalin');
            }
            document.body.removeChild(textarea);
        }

        // ---------- event listeners ----------
        generateBtn.addEventListener('click', generateNewEmail);

        // generate on domain change (optional)
        domainSelect.addEventListener('change', function() {
            if (currentEmail) {
                // regenerate with new domain
                const prefix = currentEmail.split('@')[0] || randomString(8);
                const newEmail = prefix + domainSelect.value;
                updateUI(newEmail);
            } else {
                generateNewEmail();
            }
        });

        // ---------- init ----------
        // generate pertama kali
        generateNewEmail();

        // expose copy ke global (inline onclick)
        window.copyEmail = copyEmail;

        // tambahan: jika user klik tombol generate via keyboard
        document.addEventListener('keydown', (e) => {
            if (e.key === 'g' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                generateNewEmail();
            }
        });

        // status message: simulasi 'check inbox' (hanya UI)
        // kita bisa tambahkan efek random untuk menunjukkan "pesan masuk"
        let messageCount = 0;
        setInterval(() => {
            if (currentEmail && currentEmail !== '—') {
                const random = Math.random();
                if (random > 0.7) {
                    messageCount += 1;
                    statusText.textContent = `📨 ${currentEmail} · ${messageCount} pesan`;
                } else if (random > 0.5 && messageCount > 0) {
                    // kadang turun (simulasi)
                    messageCount = Math.max(0, messageCount - 1);
                    statusText.textContent = `📨 ${currentEmail} · ${messageCount} pesan`;
                }
            }
        }, 4000);

        console.log('⚡ cvAI4 · Temp Email Generator ready');
    })();
</script>
