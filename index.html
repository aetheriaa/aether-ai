<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ TempMail + OTP · cvAI4</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            background: #0a0c10;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }
        .card {
            max-width: 800px;
            width: 100%;
            background: rgba(18, 22, 33, 0.92);
            backdrop-filter: blur(12px);
            border-radius: 2.5rem;
            padding: 2.8rem 2.4rem;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 30px 80px rgba(0,0,0,0.7);
        }
        @media (max-width: 480px) { .card { padding: 1.8rem 1.2rem; } }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            padding: 0.3rem 1rem 0.3rem 0.8rem;
            border-radius: 60px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #8b9bb5;
            text-transform: uppercase;
            margin-bottom: 1.8rem;
        }
        .badge span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #47d18c;
            border-radius: 50%;
            animation: pulse-dot 1.8s infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.7); }
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #eef2f7 0%, #b0c6e0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.3rem;
        }
        .sub {
            color: #6f7f97;
            font-size: 0.95rem;
            margin-bottom: 2rem;
            border-left: 3px solid #2f3b4d;
            padding-left: 1rem;
        }
        .email-box {
            background: #131821;
            border-radius: 1.8rem;
            padding: 1.5rem 1.8rem;
            border: 1px solid #232b38;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .email-address {
            font-size: 1.3rem;
            font-weight: 500;
            color: #d6e2f5;
            word-break: break-all;
            flex: 1;
            min-width: 140px;
            font-family: 'SF Mono', 'Fira Code', monospace;
        }
        .copy-btn, .refresh-btn {
            background: #2a3444;
            border: none;
            color: #bacee6;
            padding: 0.6rem 1.3rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid transparent;
            white-space: nowrap;
        }
        .copy-btn:hover, .refresh-btn:hover {
            background: #3d4b60;
            color: white;
            border-color: #4d5f78;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 1.8rem;
        }
        .gen-btn {
            background: linear-gradient(145deg, #2c3b52, #1a2332);
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #e0ebfa;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid #36465e;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .gen-btn:hover {
            background: #31435e;
            border-color: #5f7a9c;
        }
        .domain-select {
            background: #131821;
            border: 1px solid #232b38;
            border-radius: 60px;
            padding: 0.7rem 1.5rem;
            color: #d6e2f5;
            font-weight: 500;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            flex: 0 0 auto;
            min-width: 150px;
        }
        .domain-select option { background: #1a212b; color: #d6e2f5; }
        .inbox {
            background: #10161f;
            border-radius: 1.2rem;
            padding: 1.2rem 1.5rem;
            border: 1px solid #1c2533;
            min-height: 120px;
            margin-top: 0.5rem;
        }
        .inbox-header {
            display: flex;
            justify-content: space-between;
            color: #6f7f97;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.8rem;
            border-bottom: 1px solid #1c2533;
            padding-bottom: 0.5rem;
        }
        .inbox-item {
            background: #131821;
            border-radius: 0.8rem;
            padding: 0.8rem 1.2rem;
            margin-bottom: 0.5rem;
            border-left: 3px solid #2f3b4d;
            transition: all 0.1s;
        }
        .inbox-item:hover { border-left-color: #5f7a9c; background: #1a212b; }
        .inbox-item .subject {
            color: #d6e2f5;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .inbox-item .from {
            color: #8b9bb5;
            font-size: 0.8rem;
            margin-top: 0.2rem;
        }
        .inbox-item .body {
            color: #b0c6e0;
            font-size: 0.85rem;
            margin-top: 0.4rem;
            word-break: break-word;
            background: #0d121b;
            padding: 0.5rem 0.8rem;
            border-radius: 0.5rem;
            font-family: 'SF Mono', monospace;
            white-space: pre-wrap;
        }
        .empty-inbox {
            color: #4f5f77;
            text-align: center;
            padding: 1.5rem 0;
            font-size: 0.9rem;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: #97aecb;
            margin-top: 0.5rem;
        }
        .status .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #ffb347;
            border-radius: 50%;
            animation: pulse-dot 2s infinite;
        }
        .status .dot.green { background: #47d18c; }
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            background: #1b2638;
            border: 1px solid #33445e;
            padding: 0.8rem 2rem;
            border-radius: 60px;
            color: #dce6f5;
            font-weight: 500;
            font-size: 0.9rem;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            backdrop-filter: blur(8px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            white-space: nowrap;
            pointer-events: none;
        }
        .toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) scale(1); }
        @media (max-width: 480px) {
            .toast { font-size: 0.8rem; padding: 0.6rem 1.2rem; white-space: normal; }
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #2a3444;
            border-top-color: #bacee6;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="card">
    <div class="badge"><span></span> cvAI4 · TempMail + OTP</div>
    <h1>📬 Temp Mail</h1>
    <div class="sub">real inbox · OTP masuk · disposable</div>

    <div class="email-box">
        <span class="email-address" id="emailDisplay">—</span>
        <div style="display: flex; gap: 0.5rem;">
            <button class="refresh-btn" id="refreshInboxBtn" title="Refresh inbox">🔄</button>
            <button class="copy-btn" id="copyBtn">📋 Salin</button>
        </div>
    </div>

    <div class="controls">
        <button class="gen-btn" id="generateBtn">⟳ Buat Email Baru</button>
        <select class="domain-select" id="domainSelect">
            <option value="1secmail.com">@1secmail.com</option>
            <option value="1secmail.org">@1secmail.org</option>
            <option value="1secmail.net">@1secmail.net</option>
            <option value="esm2.net">@esm2.net</option>
            <option value="kzccv.com">@kzccv.com</option>
            <option value="qiott.com">@qiott.com</option>
            <option value="wctp.info">@wctp.info</option>
        </select>
    </div>

    <div class="inbox" id="inboxContainer">
        <div class="inbox-header">
            <span>📩 Kotak Masuk</span>
            <span id="inboxCount">0 pesan</span>
        </div>
        <div id="inboxList">
            <div class="empty-inbox">⏳ Belum ada pesan. Tunggu OTP atau refresh.</div>
        </div>
        <div class="status">
            <span class="dot green"></span>
            <span id="statusText">siap · menunggu email</span>
        </div>
    </div>
</div>

<div class="toast" id="toast">✅ Email disalin</div>

<script>
    (function() {
        'use strict';

        // ===== DOM =====
        const emailDisplay = document.getElementById('emailDisplay');
        const generateBtn = document.getElementById('generateBtn');
        const domainSelect = document.getElementById('domainSelect');
        const copyBtn = document.getElementById('copyBtn');
        const refreshBtn = document.getElementById('refreshInboxBtn');
        const inboxList = document.getElementById('inboxList');
        const inboxCount = document.getElementById('inboxCount');
        const statusText = document.getElementById('statusText');
        const toast = document.getElementById('toast');

        let currentEmail = '';
        let currentLogin = '';
        let currentDomain = '1secmail.com';
        let pollingInterval = null;

        // ===== TOAST =====
        function showToast(msg) {
            toast.textContent = msg || '✅ Email disalin';
            toast.classList.add('show');
            clearTimeout(toast._hide);
            toast._hide = setTimeout(() => { toast.classList.remove('show'); }, 2000);
        }

        // ===== RANDOM STRING =====
        function randomString(length = 8) {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        // ===== GENERATE EMAIL =====
        function generateEmail(domain) {
            const prefix = randomString(6) + (Math.random() > 0.5 ? randomString(4) : '');
            return prefix + domain;
        }

        // ===== FETCH INBOX FROM 1SECMAIL =====
        async function fetchInbox(email) {
            if (!email || !email.includes('@')) return [];
            const [login, domain] = email.split('@');
            const url = `https://www.1secmail.com/api/v1/?action=getMessages&login=${login}&domain=${domain}`;
            try {
                const response = await fetch(url);
                if (!response.ok) return [];
                const data = await response.json();
                return data || [];
            } catch (e) {
                console.warn('Fetch inbox error:', e);
                return [];
            }
        }

        // ===== FETCH MESSAGE DETAIL =====
        async function fetchMessage(email, messageId) {
            const [login, domain] = email.split('@');
            const url = `https://www.1secmail.com/api/v1/?action=readMessage&login=${login}&domain=${domain}&id=${messageId}`;
            try {
                const response = await fetch(url);
                if (!response.ok) return null;
                return await response.json();
            } catch (e) {
                console.warn('Fetch message error:', e);
                return null;
            }
        }

        // ===== RENDER INBOX =====
        async function renderInbox(email) {
            if (!email || email === '—') {
                inboxList.innerHTML = `<div class="empty-inbox">⚠️ Belum ada email</div>`;
                inboxCount.textContent = '0 pesan';
                return;
            }

            statusText.textContent = `📡 mengambil pesan...`;
            const messages = await fetchInbox(email);
            
            if (!messages || messages.length === 0) {
                inboxList.innerHTML = `<div class="empty-inbox">📭 Belum ada pesan. Tunggu OTP atau refresh.</div>`;
                inboxCount.textContent = '0 pesan';
                statusText.textContent = `📨 ${email} · 0 pesan`;
                return;
            }

            // Ambil detail setiap pesan (termasuk body)
            let html = '';
            let otpFound = '';
            for (const msg of messages) {
                const detail = await fetchMessage(email, msg.id);
                const subject = detail?.subject || msg.subject || '(tanpa judul)';
                const from = detail?.from || msg.from || 'unknown';
                const body = detail?.body || detail?.textBody || '(tidak ada konten)';
                const isHtml = detail?.htmlBody ? true : false;
                
                // Cari OTP (6 digit angka)
                const otpMatch = body.match(/\b\d{4,8}\b/);
                const otp = otpMatch ? otpMatch[0] : '';
                if (otp) otpFound = otp;

                html += `
                    <div class="inbox-item">
                        <div class="subject">📩 ${subject} ${otp ? '🔑 OTP: <strong style="color:#ffd93d;">' + otp + '</strong>' : ''}</div>
                        <div class="from">📤 ${from}</div>
                        <div class="body">${body.length > 200 ? body.substring(0, 200) + '...' : body}</div>
                    </div>
                `;
            }

            inboxList.innerHTML = html;
            inboxCount.textContent = `${messages.length} pesan`;
            statusText.textContent = `📨 ${email} · ${messages.length} pesan ${otpFound ? '· 🔑 OTP: ' + otpFound : ''}`;
        }

        // ===== UPDATE UI =====
        function updateUI(email) {
            currentEmail = email;
            emailDisplay.textContent = email || '—';
            if (email && email !== '—') {
                renderInbox(email);
                if (pollingInterval) clearInterval(pollingInterval);
                pollingInterval = setInterval(() => {
                    renderInbox(currentEmail);
                }, 8000); // refresh tiap 8 detik
            } else {
                inboxList.innerHTML = `<div class="empty-inbox">⚠️ Belum ada email</div>`;
                inboxCount.textContent = '0 pesan';
                statusText.textContent = 'siap · menunggu email';
                if (pollingInterval) {
                    clearInterval(pollingInterval);
                    pollingInterval = null;
                }
            }
        }

        // ===== GENERATE NEW =====
        function generateNewEmail() {
            const domain = domainSelect.value;
            const newEmail = generateEmail(domain);
            updateUI(newEmail);
            showToast(`📬 ${newEmail} siap`);
        }

        // ===== COPY =====
        function copyEmail() {
            if (!currentEmail || currentEmail === '—') {
                showToast('⚠️ Belum ada email');
                return;
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(currentEmail)
                    .then(() => showToast('✅ Email disalin'))
                    .catch(() => fallbackCopy(currentEmail));
            } else {
                fallbackCopy(currentEmail);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            textarea.style.left = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('✅ Email disalin');
            } catch (e) {
                showToast('⚠️ Gagal menyalin');
            }
            document.body.removeChild(textarea);
        }

        // ===== EVENT LISTENERS =====
        generateBtn.addEventListener('click', generateNewEmail);
        copyBtn.addEventListener('click', copyEmail);
        refreshBtn.addEventListener('click', () => {
            if (currentEmail && currentEmail !== '—') {
                renderInbox(currentEmail);
                showToast('🔄 Inbox di-refresh');
            }
        });

        domainSelect.addEventListener('change', function() {
            if (currentEmail && currentEmail.includes('@')) {
                const prefix = currentEmail.split('@')[0] || randomString(6);
                const newEmail = prefix + domainSelect.value;
                updateUI(newEmail);
                showToast(`📬 Domain diubah: ${newEmail}`);
            } else {
                generateNewEmail();
            }
        });

        // ===== INIT =====
        generateNewEmail();

        // Expose copy to global
        window.copyEmail = copyEmail;

        // Keyboard shortcut: Ctrl+G buat generate
        document.addEventListener('keydown', (e) => {
            if (e.key === 'g' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                generateNewEmail();
            }
            if (e.key === 'r' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                if (currentEmail && currentEmail !== '—') {
                    renderInbox(currentEmail);
                    showToast('🔄 Inbox di-refresh');
                }
            }
        });

        console.log('⚡ cvAI4 · TempMail + OTP ready');
    })();
</script>

</body>
</html>
